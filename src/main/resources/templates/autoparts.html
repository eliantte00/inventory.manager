<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de refacciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1f2933;
            background-color: #f8fafc;
        }
        body {
            margin: 0;
        }
        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
            margin-bottom: 1.5rem;
        }
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem 1.5rem;
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            display: block;
        }
        input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
        }
        .full-row {
            grid-column: 1 / -1;
        }
        button {
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.75rem;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #1d4ed8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.75rem 0.5rem;
        }
        th {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #475569;
        }
        tbody tr {
            border-bottom: 1px solid #e2e8f0;
        }
        .empty-state {
            padding: 1rem 0;
            color: #64748b;
        }
        .alert {
            background: #ecfccb;
            border: 1px solid #bef264;
            color: #365314;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <h1>Inventario de refacciones</h1>
        <p>Consulta las refacciones existentes y agrega nuevas al catálogo.</p>
    </header>

    <section class="card">
        <h2>Agregar una refacción</h2>
        <div th:if="${successMessage}" class="alert" th:text="${successMessage}"></div>
        <form th:action="@{/autoparts}" th:object="${autopartForm}" method="post">
            <div>
                <label for="name">Nombre</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Balatas" required>
            </div>
            <div>
                <label for="brand">Marca</label>
                <input id="brand" type="text" th:field="*{brand}" placeholder="ACME" required>
            </div>
            <div>
                <label for="sku">SKU</label>
                <input id="sku" type="text" th:field="*{sku}" placeholder="BP-1234" required>
            </div>
            <div>
                <label for="price">Precio</label>
                <input id="price" type="number" step="0.01" min="0" th:field="*{price}" placeholder="49.99" required>
            </div>
            <div>
                <label for="amount">Existencias</label>
                <input id="amount" type="number" min="0" th:field="*{amount}" placeholder="10" required>
            </div>
            <div class="full-row" style="margin-top: 0.5rem;">
                <button type="submit">Guardar refacción</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Refacciones registradas</h2>
        <div th:if="${#lists.isEmpty(autoparts)}" class="empty-state">
            Aún no hay refacciones. Usa el formulario para registrar la primera.
        </div>
        <div th:unless="${#lists.isEmpty(autoparts)}">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Marca</th>
                    <th>SKU</th>
                    <th>Precio</th>
                    <th>Existencias</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="autopart : ${autoparts}">
                    <td th:text="${autopart.name}"></td>
                    <td th:text="${autopart.brand}"></td>
                    <td th:text="${autopart.sku}"></td>
                    <td th:text="${#numbers.formatDecimal(autopart.price, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${autopart.amount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
